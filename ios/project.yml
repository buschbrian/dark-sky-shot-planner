# XcodeGen spec. `cd ios && xcodegen generate` writes DarkSky.xcodeproj
# (gitignored). Team and bundle ID come from Config/Local.xcconfig, which is
# gitignored; copy Config/Local.xcconfig.example to create it.
name: DarkSky

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"

packages:
  SkyCore:
    path: Packages/SkyCore
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0

targets:
  DarkSky:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SkyCore
      - package: MapLibre
        product: MapLibre
      - target: DarkSkyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: DarkSky
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dark Sky
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  DarkSkyWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    dependencies:
      - package: SkyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Dark Sky
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  DarkSkyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DarkSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        TEST_TARGET_NAME: DarkSky
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DarkSky:
    build:
      targets:
        DarkSky: all
        DarkSkyWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DarkSkyUITests
        - package: SkyCore/SkyCoreTests
