name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy --strict pipelines
      - name: Tests (offline, fixture-based, no credentials)
        run: uv run python -m pytest tests/

      # Guard: no secret, key, or token anywhere in the repo.
      - name: No-credentials guard
        run: |
          ! grep -rInE '(api[_-]?key|secret|token|password)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' \
            pipelines config .github app/src e2e || \
            (echo "::error::possible credential literal found" && exit 1)

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      # data/out is gitignored, so every job that serves or builds the site has
      # to produce it first. config.json included: the client fetches it during
      # boot and renders nothing without it.
      - name: Generate data artifacts from fixtures
        run: |
          uv run python -m pipelines.shared.cli --out data/out
          uv run python -m pipelines.light_pollution.cli build \
            --grid tests/fixtures/radiance-grid.json --publication-date 2024-12-01 \
            --out data/out/light_pollution
          uv run python -m pipelines.padus.cli \
            --input tests/fixtures/padus-sample.geojson --publication-date 2024-06-01 \
            --out data/out/padus
          uv run python -m pipelines.darksky_places.cli build \
            --csv config/darksky-places.csv --out data/out/darksky_places
      - name: Build site
        run: npx vite build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The Playwright web server is `vite`, whose publicDir is data/out. That
      # directory is gitignored, so without this step the dev server serves no
      # config.json, the client's boot() aborts, and every text-first and
      # accessibility test fails against an app that never initialized.
      - name: Generate data artifacts from fixtures
        run: |
          uv run python -m pipelines.shared.cli --out data/out
          uv run python -m pipelines.light_pollution.cli build \
            --grid tests/fixtures/radiance-grid.json --publication-date 2024-12-01 \
            --out data/out/light_pollution
          uv run python -m pipelines.padus.cli \
            --input tests/fixtures/padus-sample.geojson --publication-date 2024-06-01 \
            --out data/out/padus
          uv run python -m pipelines.darksky_places.cli build \
            --csv config/darksky-places.csv --out data/out/darksky_places

      - name: Playwright + axe (WCAG 2.1 AA)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
